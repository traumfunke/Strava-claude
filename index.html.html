<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strava × Claude</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FC4C02;
    --orange-dark: #d93e00;
    --black: #0a0a0a;
    --dark: #111111;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: ‘DM Sans’, sans-serif;
background: var(–black);
color: var(–text);
min-height: 100vh;
overflow-x: hidden;
}

/* BACKGROUND */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(252,76,2,0.15) 0%, transparent 70%);
pointer-events: none;
z-index: 0;
}

.container {
max-width: 900px;
margin: 0 auto;
padding: 0 20px;
position: relative;
z-index: 1;
}

/* HEADER */
header {
padding: 40px 0 20px;
display: flex;
align-items: center;
gap: 16px;
}

.logo {
width: 44px;
height: 44px;
background: var(–orange);
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
font-family: ‘Bebas Neue’, sans-serif;
font-size: 22px;
color: white;
flex-shrink: 0;
}

.header-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 28px;
letter-spacing: 2px;
color: var(–text);
}

.header-title span { color: var(–orange); }

/* CONNECT SCREEN */
#connect-screen {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 60vh;
text-align: center;
gap: 32px;
}

.hero-text {
font-family: ‘Bebas Neue’, sans-serif;
font-size: clamp(52px, 10vw, 90px);
line-height: 0.95;
letter-spacing: 3px;
}

.hero-text span { color: var(–orange); }

.hero-sub {
color: var(–muted);
font-size: 16px;
max-width: 380px;
line-height: 1.6;
}

.btn-connect {
display: inline-flex;
align-items: center;
gap: 12px;
background: var(–orange);
color: white;
border: none;
padding: 16px 36px;
border-radius: 50px;
font-family: ‘DM Sans’, sans-serif;
font-size: 16px;
font-weight: 600;
cursor: pointer;
transition: all 0.2s;
text-decoration: none;
}

.btn-connect:hover {
background: var(–orange-dark);
transform: translateY(-2px);
box-shadow: 0 10px 40px rgba(252,76,2,0.3);
}

/* LOADING */
#loading-screen {
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 60vh;
gap: 24px;
}

.spinner {
width: 48px;
height: 48px;
border: 3px solid var(–border);
border-top-color: var(–orange);
border-radius: 50%;
animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
color: var(–muted);
font-size: 15px;
}

/* DASHBOARD */
#dashboard {
display: none;
padding-bottom: 60px;
}

.athlete-card {
display: flex;
align-items: center;
gap: 20px;
padding: 24px;
background: var(–card);
border: 1px solid var(–border);
border-radius: 20px;
margin: 24px 0;
}

.athlete-avatar {
width: 64px;
height: 64px;
border-radius: 50%;
border: 2px solid var(–orange);
object-fit: cover;
}

.athlete-avatar-placeholder {
width: 64px;
height: 64px;
border-radius: 50%;
border: 2px solid var(–orange);
background: var(–border);
display: flex;
align-items: center;
justify-content: center;
font-size: 28px;
}

.athlete-info h2 {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 26px;
letter-spacing: 1px;
}

.athlete-info p {
color: var(–muted);
font-size: 14px;
margin-top: 4px;
}

.badge {
margin-left: auto;
background: rgba(252,76,2,0.15);
color: var(–orange);
border: 1px solid rgba(252,76,2,0.3);
padding: 6px 14px;
border-radius: 50px;
font-size: 12px;
font-weight: 600;
letter-spacing: 1px;
}

/* STATS GRID */
.stats-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 12px;
margin-bottom: 24px;
}

.stat-card {
background: var(–card);
border: 1px solid var(–border);
border-radius: 16px;
padding: 20px;
text-align: center;
transition: border-color 0.2s;
}

.stat-card:hover { border-color: var(–orange); }

.stat-value {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 36px;
color: var(–orange);
line-height: 1;
}

.stat-label {
font-size: 12px;
color: var(–muted);
margin-top: 6px;
text-transform: uppercase;
letter-spacing: 1px;
}

/* SECTION TITLE */
.section-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 22px;
letter-spacing: 2px;
color: var(–muted);
margin-bottom: 14px;
padding-bottom: 10px;
border-bottom: 1px solid var(–border);
}

/* ACTIVITIES */
.activity-list {
display: flex;
flex-direction: column;
gap: 10px;
margin-bottom: 32px;
}

.activity-item {
background: var(–card);
border: 1px solid var(–border);
border-radius: 14px;
padding: 16px 20px;
display: flex;
align-items: center;
gap: 16px;
transition: all 0.2s;
cursor: pointer;
}

.activity-item:hover {
border-color: var(–orange);
transform: translateX(4px);
}

.activity-icon {
width: 42px;
height: 42px;
background: rgba(252,76,2,0.12);
border-radius: 10px;
display: flex;
align-items: center;
justify-content: center;
font-size: 20px;
flex-shrink: 0;
}

.activity-details { flex: 1; min-width: 0; }

.activity-name {
font-weight: 600;
font-size: 15px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.activity-meta {
font-size: 12px;
color: var(–muted);
margin-top: 3px;
}

.activity-stats {
display: flex;
gap: 20px;
text-align: right;
flex-shrink: 0;
}

.activity-stat-val {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 18px;
color: var(–orange);
line-height: 1;
}

.activity-stat-lbl {
font-size: 11px;
color: var(–muted);
margin-top: 2px;
letter-spacing: 0.5px;
}

/* AI CHAT */
.ai-section {
background: var(–card);
border: 1px solid var(–border);
border-radius: 20px;
padding: 24px;
margin-bottom: 24px;
}

.ai-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 20px;
letter-spacing: 2px;
margin-bottom: 16px;
display: flex;
align-items: center;
gap: 10px;
}

.ai-dot {
width: 8px; height: 8px;
border-radius: 50%;
background: var(–orange);
animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
0%, 100% { opacity: 1; transform: scale(1); }
50% { opacity: 0.5; transform: scale(0.8); }
}

.ai-input-row {
display: flex;
gap: 10px;
}

.ai-input {
flex: 1;
background: var(–black);
border: 1px solid var(–border);
border-radius: 12px;
padding: 12px 16px;
color: var(–text);
font-family: ‘DM Sans’, sans-serif;
font-size: 14px;
outline: none;
transition: border-color 0.2s;
}

.ai-input:focus { border-color: var(–orange); }
.ai-input::placeholder { color: var(–muted); }

.ai-send-btn {
background: var(–orange);
border: none;
border-radius: 12px;
padding: 12px 20px;
color: white;
font-weight: 600;
cursor: pointer;
transition: all 0.2s;
font-size: 14px;
}

.ai-send-btn:hover { background: var(–orange-dark); }
.ai-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.ai-response {
margin-top: 16px;
padding: 16px;
background: rgba(252,76,2,0.05);
border: 1px solid rgba(252,76,2,0.15);
border-radius: 12px;
font-size: 14px;
line-height: 1.7;
display: none;
}

.quick-questions {
display: flex;
flex-wrap: wrap;
gap: 8px;
margin-bottom: 14px;
}

.quick-q {
background: var(–black);
border: 1px solid var(–border);
border-radius: 50px;
padding: 7px 14px;
font-size: 12px;
color: var(–muted);
cursor: pointer;
transition: all 0.2s;
font-family: ‘DM Sans’, sans-serif;
}

.quick-q:hover {
border-color: var(–orange);
color: var(–text);
}

/* ERROR */
.error-msg {
background: rgba(255,50,50,0.1);
border: 1px solid rgba(255,50,50,0.3);
border-radius: 12px;
padding: 14px 18px;
color: #ff6666;
font-size: 14px;
margin: 12px 0;
display: none;
}

@media (max-width: 600px) {
.stats-grid { grid-template-columns: repeat(3, 1fr); }
.activity-stats { display: none; }
.hero-text { font-size: 52px; }
}
</style>

</head>

<script>
const CLIENT_ID = '235585';
const CLIENT_SECRET = '808a69e8138cd6da1918137c1c4404cfa77d62ff';
const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];

let athleteData = null;
let activitiesData = [];

function connectStrava() {
  const scope = 'read,activity:read_all';
  const url = `https://www.strava.com/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=${scope}`;
  window.location.href = url;
}

async function exchangeToken(code) {
  const res = await fetch('https://www.strava.com/oauth/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      client_id: CLIENT_ID,
      client_secret: CLIENT_SECRET,
      code: code,
      grant_type: 'authorization_code'
    })
  });
  if (!res.ok) throw new Error('Token-Austausch fehlgeschlagen');
  return res.json();
}

async function fetchActivities(token) {
  const res = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=20', {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  if (!res.ok) throw new Error('Aktivitäten konnten nicht geladen werden');
  return res.json();
}

function sportIcon(type) {
  const icons = {
    Run: '🏃', Ride: '🚴', Swim: '🏊', Walk: '🚶', Hike: '🥾',
    WeightTraining: '💪', Yoga: '🧘', Soccer: '⚽', Tennis: '🎾',
    Rowing: '🚣', Skiing: '⛷️', Snowboard: '🏂', Kayaking: '🛶',
    VirtualRide: '🚴', VirtualRun: '🏃'
  };
  return icons[type] || '🏋️';
}

function fmt(m) {
  if (!m) return '0m';
  if (m >= 1000) return (m/1000).toFixed(1) + 'km';
  return Math.round(m) + 'm';
}

function fmtTime(s) {
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}min`;
}

function fmtDate(d) {
  return new Date(d).toLocaleDateString('de-DE', { day:'numeric', month:'short', year:'numeric' });
}

function showDashboard(athlete, activities) {
  athleteData = athlete;
  activitiesData = activities;
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  // Athlete card
  const initials = `${athlete.firstname?.[0]||''}${athlete.lastname?.[0]||''}`;
  document.getElementById('athlete-section').innerHTML = `
    <div class="athlete-card">
      ${athlete.profile && athlete.profile !== 'https://dgalywyr863hv.cloudfront.net/pictures/athletes/large.jpg'
        ? `<img class="athlete-avatar" src="${athlete.profile}" alt="Avatar">`
        : `<div class="athlete-avatar-placeholder">${initials}</div>`
      }
      <div class="athlete-info">
        <h2>${athlete.firstname || ''} ${athlete.lastname || ''}</h2>
        <p>${athlete.city ? athlete.city + ', ' : ''}${athlete.country || ''} · ${athlete.follower_count || 0} Follower</p>
      </div>
      <div class="badge">VERBUNDEN</div>
    </div>
  `;

  // Stats
  const totalDist = activities.reduce((s,a) => s + (a.distance||0), 0);
  const totalTime = activities.reduce((s,a) => s + (a.moving_time||0), 0);
  const totalElev = activities.reduce((s,a) => s + (a.total_elevation_gain||0), 0);
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${fmt(totalDist)}</div>
      <div class="stat-label">Distanz</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${fmtTime(totalTime)}</div>
      <div class="stat-label">Aktiv</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${Math.round(totalElev)}m</div>
      <div class="stat-label">Höhenmeter</div>
    </div>
  `;

  // Activities
  const list = activities.slice(0, 10).map(a => `
    <div class="activity-item">
      <div class="activity-icon">${sportIcon(a.type)}</div>
      <div class="activity-details">
        <div class="activity-name">${a.name}</div>
        <div class="activity-meta">${fmtDate(a.start_date_local)} · ${a.type}</div>
      </div>
      <div class="activity-stats">
        <div>
          <div class="activity-stat-val">${fmt(a.distance)}</div>
          <div class="activity-stat-lbl">DISTANZ</div>
        </div>
        <div>
          <div class="activity-stat-val">${fmtTime(a.moving_time)}</div>
          <div class="activity-stat-lbl">ZEIT</div>
        </div>
      </div>
    </div>
  `).join('');
  document.getElementById('activity-list').innerHTML = list || '<p style="color:var(--muted)">Keine Aktivitäten gefunden.</p>';
}

async function askAI(question) {
  const input = document.getElementById('ai-input');
  const q = question || input.value.trim();
  if (!q) return;
  input.value = '';

  const btn = document.getElementById('ai-send-btn');
  const resp = document.getElementById('ai-response');
  btn.disabled = true;
  btn.textContent = '...';
  resp.style.display = 'block';
  resp.textContent = '⏳ Analysiere deine Daten...';

  const summary = activitiesData.slice(0, 15).map(a =>
    `- ${a.type}: "${a.name}", ${fmt(a.distance)}, ${fmtTime(a.moving_time)}, ${Math.round(a.total_elevation_gain||0)}m Höhe, ${fmtDate(a.start_date_local)}`
  ).join('\n');

  const athleteInfo = athleteData ? `Athlet: ${athleteData.firstname} ${athleteData.lastname}` : '';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `Du bist ein persönlicher Sportcoach und analysierst Strava-Aktivitätsdaten. Antworte auf Deutsch, motivierend und konkret. Nutze Emojis sparsam. ${athleteInfo}`,
        messages: [{
          role: 'user',
          content: `Meine letzten Aktivitäten:\n${summary}\n\nFrage: ${q}`
        }]
      })
    });
    const data = await res.json();
    const text = data.content?.map(b => b.text||'').join('') || 'Keine Antwort erhalten.';
    resp.textContent = text;
  } catch(e) {
    resp.textContent = '❌ Fehler bei der KI-Analyse: ' + e.message;
  }

  btn.disabled = false;
  btn.textContent = 'Fragen';
}

// Handle OAuth callback
async function init() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');

  if (error) {
    document.getElementById('connect-screen').style.display = 'flex';
    return;
  }

  if (code) {
    document.getElementById('connect-screen').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'flex';
    history.replaceState({}, '', window.location.pathname);

    try {
      const tokenData = await exchangeToken(code);
      const athlete = tokenData.athlete;
      const token = tokenData.access_token;
      const activities = await fetchActivities(token);
      showDashboard(athlete, activities);
    } catch(e) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      const err = document.getElementById('error-msg');
      err.style.display = 'block';
      err.textContent = '❌ ' + e.message;
    }
    return;
  }

  document.getElementById('connect-screen').style.display = 'flex';
}

init();
</script>
